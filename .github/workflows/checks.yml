name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
      - run: npm run build
      - name: Browser tests with the actual local services
        run: |
          npx playwright install --with-deps chromium
          npm run db:migrate
          npm run dev > /tmp/api.log 2>&1 &
          ANVAYA_LOCAL_ADMIN=true npm run dev:admin > /tmp/admin.log 2>&1 &
          python3 scripts/wait-services.py
          CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npm run test:admin
      - name: Dependency advisories
        run: npm audit --omit=dev --audit-level=high
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated Xcode project
        run: |
          python3 scripts/generate-xcode.py
          git diff --exit-code -- apps/ios/Anvaya.xcodeproj
      - name: Swift formatting
        run: swift format lint --strict --recursive apps/ios tests/contracts/swift packages/api-contract/swift-client
      - name: Shared Swift wire-contract tests
        run: swift test --package-path tests/contracts/swift
      - name: Build and test iOS
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcodebuild test -project apps/ios/Anvaya.xcodeproj -scheme Anvaya -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -resultBundlePath /tmp/AnvayaResults
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-test-results, path: /tmp/AnvayaResults.xcresult }
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
